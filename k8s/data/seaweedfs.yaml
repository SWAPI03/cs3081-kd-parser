# SeaweedFS object storage with an S3-compatible API, in namespace "data" (Task 1).
#
# One Pod runs master + volume + filer + S3 gateway ("weed server -s3").
# The S3 access keys are NOT in this file: they come from the Secret "seaweedfs-s3-config",
# which scripts/secrets.sh creates from the git-ignored .env file.
#
# Inside the cluster:   http://seaweedfs.data.svc.cluster.local:8333
# From the laptop:      http://localhost:8333   (NodePort 30333, mapped in cluster/k3d.yaml)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
  namespace: data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path        # k3s built-in provisioner
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: data
  labels: {app: seaweedfs}
spec:
  replicas: 1
  strategy:
    type: Recreate                    # the volume is ReadWriteOnce: never run two copies
  selector:
    matchLabels: {app: seaweedfs}
  template:
    metadata:
      labels: {app: seaweedfs}
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.85
          imagePullPolicy: IfNotPresent
          args:
            - server
            - -dir=/data
            - -master.volumeSizeLimitMB=256
            - -volume.max=0             # 0 = size the volume count from free disk space
            - -s3
            - -s3.port=8333
            - -s3.config=/etc/seaweedfs/s3.json
          ports:
            - {name: s3, containerPort: 8333}
          readinessProbe:
            tcpSocket: {port: 8333}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "1", memory: "512Mi"}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: s3-config, mountPath: /etc/seaweedfs, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: seaweedfs-data}
        - name: s3-config
          secret: {secretName: seaweedfs-s3-config}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: data
spec:
  type: NodePort
  selector: {app: seaweedfs}
  ports:
    - name: s3
      port: 8333
      targetPort: 8333
      nodePort: 30333
